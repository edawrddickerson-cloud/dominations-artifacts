<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Artifacts · Priority</title>
  <link rel="stylesheet" href="styles.css?v=32" />
</head>
<body class="page-priority">
  <nav class="site-nav" aria-label="Pages">
    <div class="site-nav-section">
      <h2 class="site-nav-label">Army Loadout</h2>
      <a href="army.html">Army</a>
    </div>
    <div class="site-nav-section">
      <h2 class="site-nav-label">Artifacts</h2>
      <a href="index.html" aria-current="page">Priority</a>
      <a href="collection.html">Collection</a>
    </div>
    <div class="site-nav-section">
      <h2 class="site-nav-label">Council</h2>
      <a href="council.html">Priority</a>
      <a href="council-collection.html">Collection</a>
    </div>
  </nav>
  <div class="app-main">
  <header class="top">
    <div class="top-inner">
      <h1>DomiNations Artifacts</h1>
      <p class="sub">Priority · sort &amp; rate · Main/War · Legendary/Mythical · synced from <code>data/artifacts.json</code></p>
    </div>
    <div class="top-aside">
    </div>
  </header>

  <section class="filters" aria-label="Filters">
    <div class="filter-main">
      <label class="filter-control">
        Search
        <input type="search" id="q" placeholder="Name…" autocomplete="off" />
      </label>
      <fieldset class="seg-field">
        <legend>Collected</legend>
        <div class="seg" role="group" aria-label="Collected">
          <button type="button" class="seg-btn" id="collected-hide" aria-pressed="false">Hide</button>
          <button type="button" class="seg-btn is-active" id="collected-show" aria-pressed="true">Show</button>
        </div>
      </fieldset>
      <fieldset class="seg-field">
        <legend>Hall</legend>
        <div class="seg" role="group" aria-label="Hall">
          <button type="button" class="seg-btn" data-hall="Main" id="hall-main" aria-pressed="false">Main</button>
          <button type="button" class="seg-btn is-active" data-hall="War" id="hall-war" aria-pressed="true">War</button>
        </div>
      </fieldset>
      <fieldset class="seg-field">
        <legend>Grade</legend>
        <div class="seg" role="group" aria-label="Grade">
          <button type="button" class="seg-btn is-active" data-grade="" id="grade-all" aria-pressed="true">All</button>
          <button type="button" class="seg-btn" data-grade="Legendary" id="grade-leg" aria-pressed="false">Legendary</button>
          <button type="button" class="seg-btn" data-grade="Mythical" id="grade-myth" aria-pressed="false">Mythical</button>
        </div>
      </fieldset>
      <div class="filter-control cost-filter" id="cost-filter">
        <span class="filter-label">Cost</span>
        <button type="button" id="cost-filter-btn" class="btn perk-filter-btn" aria-expanded="false" aria-controls="cost-filter-panel">
          Any cost
        </button>
        <div id="cost-filter-panel" class="perk-filter-panel" hidden>
          <div id="cost-filter-list" class="perk-filter-list" role="group" aria-label="Cost checklist">
            <label class="perk-check"><input type="checkbox" name="cost-tier" value="1000" /> <span>1000</span></label>
            <label class="perk-check"><input type="checkbox" name="cost-tier" value="300" /> <span>300</span></label>
            <label class="perk-check"><input type="checkbox" name="cost-tier" value="100" /> <span>100</span></label>
            <label class="perk-check"><input type="checkbox" name="cost-tier" value="unknown" /> <span>Unknown</span></label>
          </div>
          <div class="perk-filter-actions">
            <button type="button" id="cost-filter-clear" class="btn btn-small">Clear costs</button>
          </div>
        </div>
      </div>
      <div class="filter-control perk-filter" id="perk-filter">
        <span class="filter-label">Perks</span>
        <div class="perk-filter-row">
          <button type="button" id="perk-filter-btn" class="btn perk-filter-btn" aria-expanded="false" aria-controls="perk-filter-panel">
            Any perk
          </button>
          <div class="seg seg-mini" role="group" aria-label="Perk match mode">
            <button type="button" class="seg-btn is-active" id="perk-match-and" data-perk-match="and" aria-pressed="true">AND</button>
            <button type="button" class="seg-btn" id="perk-match-or" data-perk-match="or" aria-pressed="false">OR</button>
          </div>
        </div>
        <div id="perk-filter-panel" class="perk-filter-panel" hidden>
          <input type="search" id="perk-filter-q" placeholder="Filter perks…" autocomplete="off" />
          <div id="perk-filter-list" class="perk-filter-list" role="group" aria-label="Perk checklist"></div>
          <div class="perk-filter-actions">
            <button type="button" id="perk-filter-clear" class="btn btn-small">Clear perks</button>
          </div>
        </div>
      </div>
      <fieldset class="seg-field pref-sort-axes" id="pref-sort-axes" title="Off/Def = perk rating × strongest available stat magnitude">
        <legend>Sort</legend>
        <div class="seg seg-mini" role="group" aria-label="Sort preference axes">
          <button type="button" class="seg-btn is-active" id="sort-off" aria-pressed="true">Off</button>
          <button type="button" class="seg-btn is-active" id="sort-def" aria-pressed="true">Def</button>
        </div>
      </fieldset>
      <fieldset class="seg-field score-mode-field" id="score-mode" title="Combined sums every perk line; Best uses the single highest active-axis line">
        <legend>Score</legend>
        <div class="seg seg-mini" role="group" aria-label="Score mode">
          <button type="button" class="seg-btn is-active" id="score-combined" aria-pressed="true">Sum</button>
          <button type="button" class="seg-btn" id="score-maxrow" aria-pressed="false">Best</button>
        </div>
      </fieldset>
    </div>
    <div class="filter-actions">
      <button type="button" id="clear" class="btn">Clear</button>
    </div>
  </section>

  <p id="error" class="error" hidden></p>

  <div class="table-wrap">
    <table id="table">
      <thead>
        <tr>
          <th data-sort="name" aria-sort="none" scope="col" title="Checkbox marks artifacts you already own"><button type="button" class="th-sort">Name</button></th>
          <th data-sort="hall" aria-sort="none" scope="col"><button type="button" class="th-sort">Hall</button></th>
          <th data-sort="grade" aria-sort="none" scope="col"><button type="button" class="th-sort">Grade</button></th>
          <th data-sort="perks" aria-sort="none" scope="col" title="Perk name and stat range"><button type="button" class="th-sort">Stats</button></th>
          <th scope="col" class="th-plain" title="Per-line Offensive scores (rating × stat magnitude)"><span class="th-label">Off</span></th>
          <th scope="col" class="th-plain" title="Per-line Defensive scores (rating × stat magnitude)"><span class="th-label">Def</span></th>
          <th data-sort="offensive" aria-sort="none" scope="col" title="Offensive total: Combined sum or Best line. With both Sort axes checked, Off/Def headers sort by Off+Def."><button type="button" class="th-sort">Off Σ</button></th>
          <th data-sort="defensive" aria-sort="none" scope="col" title="Defensive total: Combined sum or Best line. With both Sort axes checked, Off/Def headers sort by Off+Def."><button type="button" class="th-sort">Def Σ</button></th>
          <th data-sort="cost" aria-sort="none" scope="col" title="Sort by cost tier"><button type="button" class="th-sort">Cost</button></th>
          <th data-sort="pref_per_cost" aria-sort="none" scope="col" title="Active preference score ÷ token cost. Blank when cost unknown."><button type="button" class="th-sort">Pref/cost</button></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  </div>
  <script src="shared.js?v=21"></script>
  <script src="profiles-ui.js?v=5"></script>
  <script src="app.js?v=23"></script>
</body>
</html>
