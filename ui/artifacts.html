<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script src="navigation.js?v=20261022-fixed-header"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Artifacts · Artifact rankings</title>
  <link rel="stylesheet" href="styles.css?v=20261020-shared-header" />
  <link rel="stylesheet" href="strategy-collection.css?v=20261017-strategies" />
</head>
<body class="page-priority">
  <nav class="site-nav" aria-label="Pages">
    <div class="site-nav-section">
      <h2 class="site-nav-label">Artifacts</h2>
      <a href="artifacts.html" aria-current="page">Artifact Rankings</a>
      <a href="collection.html">Crafted Collection</a>
      <a href="totals.html">Active Totals</a>
      <a href="scanner.html?v=2">Crafting Scanner</a>
      <a href="storage-scanner.html?v=2">Storage Scanner</a>
    </div>
    <div class="site-nav-section">
      <h2 class="site-nav-label">Council</h2>
      <a href="council.html">Council Rankings</a>
      <a href="council-collection.html">Collection</a>
    </div>
  </nav>
  <div class="app-main">
  <header class="top app-header">
    <div class="top-inner"><h1>DomiNations Artifacts</h1></div>
    <div class="header-controls" aria-label="Primary filters">
      <fieldset class="seg-field"><legend>Hall</legend><div class="seg" role="group" aria-label="Hall"><button type="button" class="seg-btn" id="hall-main" data-hall="Main" aria-pressed="false">Main</button><button type="button" class="seg-btn" id="hall-war" data-hall="War" aria-pressed="false">War</button></div></fieldset>
      <fieldset class="seg-field" id="pref-sort-axes"><legend>Base Type</legend><div class="seg seg-mini" role="group" aria-label="Base Type"><button type="button" class="seg-btn" id="sort-off" aria-pressed="false">Off</button><button type="button" class="seg-btn" id="sort-def" aria-pressed="false">Def</button></div></fieldset>
      <div id="header-profile" class="header-profile"></div>
    </div>
  </header>

  <section class="filters" aria-label="Filters">
    <div class="filter-main">
      <label class="filter-control">
        Search
        <input type="search" id="q" placeholder="Name…" autocomplete="off" />
      </label>
      <fieldset class="seg-field">
        <legend>Collected</legend>
        <div class="seg" role="group" aria-label="Collected">
          <button type="button" class="seg-btn" id="collected-hide" aria-pressed="false">Hide</button>
          <button type="button" class="seg-btn is-active" id="collected-show" aria-pressed="true">Show</button>
        </div>
      </fieldset>
      <fieldset class="seg-field">
        <legend>Grade</legend>
        <div class="seg" role="group" aria-label="Grade">
          <button type="button" class="seg-btn is-active" data-grade="" id="grade-all" aria-pressed="true">All</button>
          <button type="button" class="seg-btn" data-grade="Legendary" id="grade-leg" aria-pressed="false">Legendary</button>
          <button type="button" class="seg-btn" data-grade="Mythical" id="grade-myth" aria-pressed="false">Mythical</button>
        </div>
      </fieldset>
      <div class="filter-control cost-filter" id="cost-filter">
        <span class="filter-label">Cost</span>
        <button type="button" id="cost-filter-btn" class="btn perk-filter-btn" aria-expanded="false" aria-controls="cost-filter-panel">
          Any cost
        </button>
        <div id="cost-filter-panel" class="perk-filter-panel" hidden>
          <div id="cost-filter-list" class="perk-filter-list" role="group" aria-label="Cost checklist">
            <label class="perk-check"><input type="checkbox" name="cost-tier" value="1000" /> <span>1000</span></label>
            <label class="perk-check"><input type="checkbox" name="cost-tier" value="300" /> <span>300</span></label>
            <label class="perk-check"><input type="checkbox" name="cost-tier" value="100" /> <span>100</span></label>
            <label class="perk-check"><input type="checkbox" name="cost-tier" value="unknown" /> <span>Unknown</span></label>
          </div>
          <div class="perk-filter-actions">
            <button type="button" id="cost-filter-clear" class="btn btn-small">Clear costs</button>
          </div>
        </div>
      </div>
      <div class="filter-control perk-filter" id="perk-filter">
        <span class="filter-label">Perks</span>
        <div class="perk-filter-row">
          <button type="button" id="perk-filter-btn" class="btn perk-filter-btn" aria-expanded="false" aria-controls="perk-filter-panel">
            Any perk
          </button>
          <div class="seg seg-mini" role="group" aria-label="Perk match mode">
            <button type="button" class="seg-btn is-active" id="perk-match-and" data-perk-match="and" aria-pressed="true">AND</button>
            <button type="button" class="seg-btn" id="perk-match-or" data-perk-match="or" aria-pressed="false">OR</button>
          </div>
        </div>
        <div id="perk-filter-panel" class="perk-filter-panel" hidden>
          <input type="search" id="perk-filter-q" placeholder="Filter perks…" autocomplete="off" />
          <div id="perk-filter-list" class="perk-filter-list" role="group" aria-label="Perk checklist"></div>
          <div class="perk-filter-actions">
            <button type="button" id="perk-filter-clear" class="btn btn-small">Clear perks</button>
          </div>
        </div>
      </div>
      <fieldset class="seg-field score-mode-field" id="score-mode" title="Hall sums every perk line; Showcase uses the single highest active-axis line">
        <legend>Scored For</legend>
        <div class="seg seg-mini" role="group" aria-label="Scored For">
          <button type="button" class="seg-btn is-active" id="score-combined" aria-pressed="true">Hall</button>
          <button type="button" class="seg-btn" id="score-maxrow" aria-pressed="false">Showcase</button>
        </div>
      </fieldset>
    </div>
  </section>

  <p id="error" class="error" hidden></p>

  <div class="table-wrap">
    <table id="table">
      <thead>
        <tr>
          <th data-sort="name" aria-sort="none" scope="col"><button type="button" class="th-sort">Name</button></th>
          <th data-sort="collected" aria-sort="none" scope="col" title="Sort by collected status"><button type="button" class="th-sort">Collected</button></th>
          <th data-sort="hall" aria-sort="none" scope="col"><button type="button" class="th-sort">Hall</button></th>
          <th data-sort="grade" aria-sort="none" scope="col"><button type="button" class="th-sort">Grade</button></th>
          <th data-sort="perks" aria-sort="none" scope="col" title="Perk name and stat range"><button type="button" class="th-sort">Stats</button></th>
          <th scope="col" class="th-plain" title="Off and Def ratings for each stat, before multiplying by magnitude"><span class="th-label">Perk rating</span></th>
          <th data-score-axis="offensive" scope="col" class="th-plain th-numeric" title="Per-line Offensive scores (rating × stat magnitude)"><span class="th-label">Off</span></th>
          <th data-score-axis="defensive" scope="col" class="th-plain th-numeric" title="Per-line Defensive scores (rating × stat magnitude)"><span class="th-label">Def</span></th>
          <th class="th-numeric" data-score-axis="offensive" data-sort="offensive" aria-sort="none" scope="col" title="Offensive total: Hall sum or Showcase line. Sorts by this total first; with both axes selected, the other total breaks ties."><button type="button" class="th-sort">Off Σ</button></th>
          <th class="th-numeric" data-score-axis="defensive" data-sort="defensive" aria-sort="none" scope="col" title="Defensive total: Hall sum or Showcase line. Sorts by this total first; with both axes selected, the other total breaks ties."><button type="button" class="th-sort">Def Σ</button></th>
          <th class="th-numeric" data-sort="cost" aria-sort="none" scope="col" title="Sort by cost tier"><button type="button" class="th-sort">Cost</button></th>
          <th class="th-numeric" data-sort="pref_per_cost" aria-sort="none" scope="col" title="Active preference score ÷ token cost. Blank when cost unknown."><button type="button" class="th-sort">Pref/cost</button></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  </div>
  <script src="data/army_catalog.js?v=8"></script>
  <script src="shared.js?v=20261021-ranking-targets"></script>
  <script src="profiles-ui.js?v=20261022-scanner-header"></script>
  <script src="data/artifact_stat_context.js?v=1"></script>
  <script src="crafting-purposes.js?v=20261022-rating-labels"></script>
  <script src="artifact-scoring.js?v=20261017-strategies-reroll"></script>
  <script src="stored-artifacts.js?v=20261018-services"></script>
  <script src="app.js?v=20261021-ranking-target-filter"></script>

  <script src="services.js?v=20261022-shell-signin"></script>
</body>
</html>
