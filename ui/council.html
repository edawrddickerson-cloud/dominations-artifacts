<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script src="navigation.js?v=20261025-crafting-stats"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Council Rankings</title>
  <link rel="stylesheet" href="styles.css?v=20261020-shared-header" />
  <link rel="stylesheet" href="council.css?v=20261022-shared-ratings" />
</head>
<body class="page-council-priority">
  <nav class="site-nav" aria-label="Pages">
    <div class="site-nav-section">
      <h2 class="site-nav-label">Artifacts</h2>
      <a href="artifacts.html">Artifact Rankings</a>
      <a href="collection.html">Crafted Collection</a>
      <a href="totals.html">Active Totals</a>
      <a href="scanner.html?v=2">Crafting Scanner</a>
      <a href="storage-scanner.html?v=2">Storage Scanner</a>
    </div>
    <div class="site-nav-section">
      <h2 class="site-nav-label">Council</h2>
      <a href="council.html" aria-current="page">Council Rankings</a>
      <a href="council-collection.html">Collection</a>
    </div>
  </nav>
  <div class="app-main">
  <header class="top app-header">
    <div class="top-inner"><h1>DomiNations Artifacts</h1></div>
    <div class="header-controls" aria-label="Primary filters">
      <fieldset class="seg-field"><legend>Hall</legend><div class="seg" role="group" aria-label="Hall"><button type="button" class="seg-btn" id="mode-main" data-mode="main" aria-pressed="false">Main</button><button type="button" class="seg-btn" id="mode-war" data-mode="war" aria-pressed="false">War</button></div></fieldset>
      <fieldset class="seg-field" id="pref-sort-axes"><legend>Base Type</legend><div class="seg seg-mini" role="group" aria-label="Base Type"><button type="button" class="seg-btn" id="sort-off" aria-pressed="false">Off</button><button type="button" class="seg-btn" id="sort-def" aria-pressed="false">Def</button></div></fieldset>
      <div id="header-profile" class="header-profile"></div>
    </div>
  </header><div class="stats" id="stats" aria-live="polite"></div>

  <section class="filters" aria-label="Filters">
    <div class="filter-main">
      <label class="filter-control">
        Search
        <input type="search" id="q" placeholder="Name…" autocomplete="off" />
      </label>
      <label class="filter-control">
        Type
        <select id="type">
          <option value="">All</option>
        </select>
      </label>
      <fieldset class="seg-field">
        <legend>Collected</legend>
        <div class="seg" role="group" aria-label="Collected">
          <button type="button" class="seg-btn" id="collected-hide" aria-pressed="false">Hide</button>
          <button type="button" class="seg-btn is-active" id="collected-show" aria-pressed="true">Show</button>
        </div>
      </fieldset>
      <fieldset class="seg-field">
        <legend>Rarity</legend>
        <div class="seg" role="group" aria-label="Browse rarity" id="rarity-seg">
          <button type="button" class="seg-btn" data-rarity="Common" aria-pressed="false">Common</button>
          <button type="button" class="seg-btn" data-rarity="Uncommon" aria-pressed="false">Uncommon</button>
          <button type="button" class="seg-btn" data-rarity="Rare" aria-pressed="false">Rare</button>
          <button type="button" class="seg-btn" data-rarity="Epic" aria-pressed="false">Epic</button>
          <button type="button" class="seg-btn" data-rarity="Legendary" aria-pressed="false">Legendary</button>
        </div>
      </fieldset>
      <div class="filter-control perk-filter" id="stat-filter">
        <span class="filter-label">Stats</span>
        <div class="perk-filter-row">
          <button type="button" id="stat-filter-btn" class="btn perk-filter-btn" aria-expanded="false" aria-controls="stat-filter-panel">
            Any stat
          </button>
          <div class="seg seg-mini" role="group" aria-label="Stat match mode">
            <button type="button" class="seg-btn is-active" id="stat-match-and" data-stat-match="and" aria-pressed="true">AND</button>
            <button type="button" class="seg-btn" id="stat-match-or" data-stat-match="or" aria-pressed="false">OR</button>
          </div>
        </div>
        <div id="stat-filter-panel" class="perk-filter-panel" hidden>
          <input type="search" id="stat-filter-q" placeholder="Filter stats…" autocomplete="off" />
          <div id="stat-filter-list" class="perk-filter-list" role="group" aria-label="Stat checklist"></div>
          <div class="perk-filter-actions">
            <button type="button" id="stat-filter-clear" class="btn btn-small">Clear stats</button>
          </div>
        </div>
      </div>
      <fieldset class="seg-field score-mode-field" id="score-mode" title="Hall adds every stat line; Showcase uses the single highest active-axis line">
        <legend>Scored For</legend>
        <div class="seg seg-mini" role="group" aria-label="Scored For">
          <button type="button" class="seg-btn is-active" id="score-combined" aria-pressed="true">Hall</button>
          <button type="button" class="seg-btn" id="score-maxrow" aria-pressed="false">Showcase</button>
        </div>
      </fieldset>
    </div>
  </section>

  <p id="error" class="error" hidden></p>

  <div class="table-wrap">
    <table id="table">
      <thead>
        <tr>
          <th data-sort="name" aria-sort="none" scope="col"><button type="button" class="th-sort">Name</button></th>
          <th data-sort="collected" aria-sort="none" scope="col" title="Sort by collected status"><button type="button" class="th-sort">Collected</button></th>
          <th data-sort="type" aria-sort="none" scope="col"><button type="button" class="th-sort">Type</button></th>
          <th data-sort="stats" aria-sort="none" scope="col" title="Stat name and bonus at browse rarity"><button type="button" class="th-sort">Stats</button></th>
          <th scope="col" class="th-plain" title="Off and Def ratings for each stat, before multiplying by magnitude"><span class="th-label">Perk rating</span></th>
          <th data-score-axis="offensive" scope="col" class="th-plain th-numeric" title="Per-line Offensive scores (rating × magnitude)"><span class="th-label">Off</span></th>
          <th data-score-axis="defensive" scope="col" class="th-plain th-numeric" title="Per-line Defensive scores (rating × magnitude)"><span class="th-label">Def</span></th>
          <th class="th-numeric" data-score-axis="offensive" data-sort="offensive" aria-sort="none" scope="col" title="Offensive total: Hall sum or Showcase line. Sorts by this total first; with both axes selected, the other total breaks ties."><button type="button" class="th-sort">Off Σ</button></th>
          <th class="th-numeric" data-score-axis="defensive" data-sort="defensive" aria-sort="none" scope="col" title="Defensive total: Hall sum or Showcase line. Sorts by this total first; with both axes selected, the other total breaks ties."><button type="button" class="th-sort">Def Σ</button></th>
          <th class="th-numeric" data-sort="preference" aria-sort="none" scope="col" title="Hall sums the higher selected-axis score per stat. Showcase uses the highest selected-axis stat."><button type="button" class="th-sort">Score</button></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  </div>
  <script src="data/army_catalog.js?v=8"></script>
  <script src="shared.js?v=20261019-rating-scale"></script>
  <script src="profiles-ui.js?v=20261025-page-filters"></script>
  <script src="council-shared.js?v=20261022-shared-ratings"></script>
  <script src="council.js?v=20261022-shared-ratings"></script>

  <script src="services.js?v=20261025-probability-release"></script>
</body>
</html>
