<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script src="navigation.js?v=20261025-crafting-stats"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Council Ratings</title>
  <link rel="stylesheet" href="styles.css?v=20261020-shared-header" />
  <link rel="stylesheet" href="council.css?v=20261022-shared-ratings" />
</head>
<body class="page-ratings page-council-ratings">
  <nav class="site-nav" aria-label="Pages">
    <div class="site-nav-section">
      <h2 class="site-nav-label">Artifacts</h2>
      <a href="artifacts.html">Artifact Rankings</a>
      <a href="collection.html">Crafted Collection</a>
      <a href="totals.html">Active Totals</a>
      <a href="scanner.html?v=2">Crafting Scanner</a>
      <a href="storage-scanner.html?v=2">Storage Scanner</a>
    </div>
    <div class="site-nav-section">
      <h2 class="site-nav-label">Council</h2>
      <a href="council.html">Council Rankings</a>
      <a href="council-collection.html">Collection</a>
    </div>
  </nav>
  <div class="app-main">
  <header class="top app-header">
    <div class="top-inner"><h1>DomiNations Artifacts</h1></div>
    <div class="header-controls" aria-label="Primary filters">
      <fieldset class="seg-field"><legend>Hall</legend><div class="seg" role="group" aria-label="Hall"><button type="button" class="seg-btn" id="header-main" aria-pressed="false">Main</button><button type="button" class="seg-btn" id="header-war" aria-pressed="false">War</button></div></fieldset>
      <fieldset class="seg-field"><legend>Base Type</legend><div class="seg seg-mini" role="group" aria-label="Base Type"><button type="button" class="seg-btn" id="header-off" aria-pressed="false">Off</button><button type="button" class="seg-btn" id="header-def" aria-pressed="false">Def</button></div></fieldset>
      <div id="header-profile" class="header-profile"></div>
    </div>
  </header>

  <section class="filters ratings-page-controls" aria-label="Ratings controls">
    <div class="filter-main">
      <label class="filter-control">Group by
        <select id="ratings-group-by"><option value="family">Stat family</option><option value="none">None</option></select>
      </label>
      <label class="filter-control">Show
        <select id="ratings-show"><option value="all">All ratings</option><option value="overridden">Council overrides</option><option value="zero">Zero ratings</option><option value="shared">Shared stats</option><option value="council">Council-only stats</option></select>
      </label>
      <label class="filter-control">
        Search
        <input type="search" id="ratings-q" placeholder="Search stats…" autocomplete="off" />
      </label>
    </div>
    <div class="filter-actions">
      <button type="button" id="ratings-reset" class="btn">Clear Council overrides</button>
    </div>
  </section>

  <p id="error" class="error" hidden></p>
  <div class="stats" id="ratings-count" aria-live="polite"></div>

  <div class="ratings-page-scroll" id="ratings-scroll">
    <div id="ratings-grid"></div>
  </div>
  </div>

  <script src="data/army_catalog.js?v=8"></script>
  <script src="shared.js?v=20261019-rating-scale"></script>
  <script src="profiles-ui.js?v=20261025-page-filters"></script>
  <script src="council-shared.js?v=20261022-shared-ratings"></script>
  <script src="council-ratings.js?v=20261022-shared-ratings"></script>

  <script src="services.js?v=20261025-dashboard"></script>
</body>
</html>
